[graph]
all-features = true

[advisories]
yanked = "deny"
# `ttf-parser` is a transitive dependency of the current caption/font stack.
# The RustSec advisory is informational (the crate is unmaintained), and no
# compatible drop-in upgrade is available yet; keep it visible in audits
# without blocking the dependency-policy gate.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
