<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResubWinny · 输出格式限制原型</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%230a84ff%22/><path d=%22M4 5h8M4 8h5M4 11h7%22 stroke=%22white%22 stroke-width=%221.5%22 stroke-linecap=%22round%22/></svg>" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="prototype-shell">
      <header class="prototype-heading">
        <span>ResubWinny 设计原型</span>
        <h1>输出格式与特殊字幕能力</h1>
        <p>选择一个或多个输出格式，并在导出前看清哪些内容会保留、转换或需要处理。</p>
      </header>
      <div id="stage"></div>
    </main>

    <nav class="proto-picker" aria-label="Prototype variants">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <button class="proto-picker-item" data-active aria-current="true">静默提醒</button>
      <button class="proto-picker-item">能力矩阵</button>
      <button class="proto-picker-item">检查器</button>
    </nav>

    <script type="module" src="./app.js"></script>
  </body>
</html>
