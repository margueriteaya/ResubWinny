name: Build pinned LGPL libmpv

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x86_64:
    name: Windows x86_64 libmpv and corresponding source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Cache downloads are segmented by actions/cache.  Bound a stalled segment so
      # an unavailable cache service cannot consume the entire six-hour job budget.
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
      # Bump this only when the compiled ABI/recipe becomes incompatible. Workflow
      # logging, cache plumbing, and timeout edits must not discard compiled output.
      LIBMPV_BUILD_CACHE_VERSION: v3-r1
    steps:
      - name: Checkout ResubWinny
        uses: actions/checkout@v7

      - name: Read the canonical dependency pins
        id: pins
        shell: pwsh
        run: |
          $dependency = (Get-Content -Raw third_party/versions.json | ConvertFrom-Json).dependencies.libmpvWindowsX86_64
          "build_tag=$($dependency.buildTag)" >> $env:GITHUB_OUTPUT
          "build_recipe_commit=$($dependency.buildRecipeCommit)" >> $env:GITHUB_OUTPUT
          "toolchain_commit=$($dependency.toolchainCommit)" >> $env:GITHUB_OUTPUT
          "mpv_commit=$($dependency.mpvCommit)" >> $env:GITHUB_OUTPUT
          "ffmpeg_commit=$($dependency.ffmpegCommit)" >> $env:GITHUB_OUTPUT

      - name: Install native Ubuntu build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex gettext git mercurial subversion \
            ninja-build gyp cmake yasm nasm automake pkg-config libtool \
            libtool-bin gcc-multilib g++-multilib clang lld libc++-dev \
            libc++abi-dev libgmp-dev libmpfr-dev libmpc-dev libgcrypt20-dev \
            gperf ragel texinfo autopoint re2c asciidoc python3-roman \
            python3-mako python3-jsonschema python3-venv rst2pdf python3-cairo \
            docbook2x unzip p7zip-full curl wget libmimalloc-dev ccache glslc

      - name: Install pinned Python build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv build/libmpv-python-tools
          build/libmpv-python-tools/bin/python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement third_party/libmpv/build-requirements.txt
          echo "$GITHUB_WORKSPACE/build/libmpv-python-tools/bin" >> "$GITHUB_PATH"
          build/libmpv-python-tools/bin/meson --version

      - name: Check out pinned build sources
        shell: bash
        env:
          BUILD_RECIPE_COMMIT: ${{ steps.pins.outputs.build_recipe_commit }}
          TOOLCHAIN_COMMIT: ${{ steps.pins.outputs.toolchain_commit }}
        run: |
          set -euo pipefail
          mkdir -p build/libmpv
          git clone https://github.com/zhongfly/mpv-winbuild.git build/libmpv/recipe
          git -C build/libmpv/recipe checkout --detach "$BUILD_RECIPE_COMMIT"
          git clone https://github.com/shinchiro/mpv-winbuild-cmake.git build/libmpv/toolchain
          git -C build/libmpv/toolchain checkout --detach "$TOOLCHAIN_COMMIT"
          git -C build/libmpv/toolchain config user.name "ResubWinny Build"
          git -C build/libmpv/toolchain config user.email "build@resubwinny.invalid"

      - name: Restore reusable libmpv sources and Rust toolchain
        id: libmpv-source-cache
        timeout-minutes: 20
        uses: actions/cache/restore@v5
        with:
          path: |
            build/libmpv/toolchain/src_packages
            build/libmpv/toolchain/install_rustup
          # v2 deliberately excludes clang_root.  The compiler wrapper requires
          # the MinGW sysroot under build64, so both must be restored together.
          key: ${{ runner.os }}-libmpv-sources-v2-${{ steps.pins.outputs.toolchain_commit }}-${{ steps.pins.outputs.build_recipe_commit }}-${{ steps.pins.outputs.mpv_commit }}-${{ steps.pins.outputs.ffmpeg_commit }}

      - name: Restore exact reusable libmpv build state
        id: libmpv-build-cache
        timeout-minutes: 20
        uses: actions/cache/restore@v5
        with:
          path: |
            build/libmpv/toolchain/build64
            build/libmpv/toolchain/clang_root
          key: ${{ runner.os }}-libmpv-build-${{ env.LIBMPV_BUILD_CACHE_VERSION }}-${{ steps.pins.outputs.toolchain_commit }}-${{ steps.pins.outputs.build_recipe_commit }}-${{ steps.pins.outputs.mpv_commit }}-${{ steps.pins.outputs.ffmpeg_commit }}
          # The first v3 run migrates the complete state saved by run 33531724263.
          # This exact fallback is intentionally compatible: the fix below repairs
          # the previously failed subrandr build without changing completed outputs.
          restore-keys: |
            ${{ runner.os }}-libmpv-build-v2-86cd44af8a0eb88851a18c63542cf8c1694aa446e585e7f0b1e688f903b38396

      - name: Restore legacy libmpv state for one-time cache migration
        id: libmpv-legacy-cache
        if: ${{ steps.libmpv-source-cache.outputs.cache-hit != 'true' && steps.libmpv-build-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 20
        uses: actions/cache/restore@v5
        with:
          path: |
            build/libmpv/toolchain/build64
            build/libmpv/toolchain/src_packages
            build/libmpv/toolchain/clang_root
            build/libmpv/toolchain/install_rustup
          key: ${{ runner.os }}-libmpv-legacy-migration-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-libmpv-

      - name: Remove unmatched cached build outputs
        if: ${{ steps.libmpv-build-cache.outputs.cache-matched-key == '' }}
        shell: bash
        run: rm -rf build/libmpv/toolchain/build64 build/libmpv/toolchain/clang_root

      - name: Summarize libmpv cache restoration
        shell: bash
        env:
          SOURCE_CACHE_HIT: ${{ steps.libmpv-source-cache.outputs.cache-hit }}
          SOURCE_MATCHED_KEY: ${{ steps.libmpv-source-cache.outputs.cache-matched-key }}
          BUILD_CACHE_HIT: ${{ steps.libmpv-build-cache.outputs.cache-hit }}
          BUILD_MATCHED_KEY: ${{ steps.libmpv-build-cache.outputs.cache-matched-key }}
          LEGACY_CACHE_HIT: ${{ steps.libmpv-legacy-cache.outputs.cache-hit }}
          LEGACY_MATCHED_KEY: ${{ steps.libmpv-legacy-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          cache_status() {
            case "$1" in
              true) printf 'exact hit' ;;
              false) printf 'prefix hit' ;;
              *) printf 'miss' ;;
            esac
          }
          {
            echo '### libmpv cache'
            echo
            echo "- Source/toolchain: $(cache_status "$SOURCE_CACHE_HIT") ${SOURCE_MATCHED_KEY:+(key: $SOURCE_MATCHED_KEY)}"
            echo "- Build state: $(cache_status "$BUILD_CACHE_HIT") ${BUILD_MATCHED_KEY:+(key: $BUILD_MATCHED_KEY)}"
            echo "- Legacy migration: $(cache_status "$LEGACY_CACHE_HIT") ${LEGACY_MATCHED_KEY:+(key: $LEGACY_MATCHED_KEY)}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sanitize restored source repositories
        shell: bash
        run: |
          set -euo pipefail
          if [ -d build/libmpv/toolchain/src_packages ]; then
            find build/libmpv/toolchain/src_packages -type d -name .git -prune -print0 |
              while IFS= read -r -d '' git_dir; do
                repo="${git_dir%/.git}"
                git -C "$repo" am --abort >/dev/null 2>&1 || true
                git -C "$repo" reset --hard
              done
          fi

      - name: Apply reviewed LGPL recipe
        shell: bash
        run: |
          set -euo pipefail
          for patch in build/libmpv/recipe/patch/*.patch; do
            git -C build/libmpv/toolchain am --3way "$GITHUB_WORKSPACE/$patch"
          done
          git -C build/libmpv/toolchain am --3way "$GITHUB_WORKSPACE/build/libmpv/recipe/compile-lgpl-libmpv.patch"
          for patch in "$GITHUB_WORKSPACE"/third_party/libmpv/patches/*.patch; do
            git -C build/libmpv/toolchain apply "$patch"
          done

      - name: Pin mpv and FFmpeg source commits
        shell: python
        env:
          MPV_COMMIT: ${{ steps.pins.outputs.mpv_commit }}
          FFMPEG_COMMIT: ${{ steps.pins.outputs.ffmpeg_commit }}
        run: |
          import os
          from pathlib import Path

          pins = {
              "mpv.cmake": os.environ["MPV_COMMIT"],
              "ffmpeg.cmake": os.environ["FFMPEG_COMMIT"],
          }
          root = Path("build/libmpv/toolchain/packages")
          for filename, commit in pins.items():
              path = root / filename
              text = path.read_text(encoding="utf-8")
              marker = "    GIT_REPOSITORY"
              line_end = text.index("\n", text.index(marker)) + 1
              text = text[:line_end] + f"    GIT_TAG {commit}\n" + text[line_end:]
              path.write_text(text, encoding="utf-8", newline="\n")

      - name: Verify provisioned nightly Rust cross target
        shell: bash
        run: |
          set -euo pipefail
          rust_root="$GITHUB_WORKSPACE/build/libmpv/toolchain/install_rustup"
          rustup="$rust_root/.cargo/bin/rustup"
          if [ ! -x "$rustup" ]; then
            echo "Rust has not been provisioned yet; the clean build will install it."
            exit 0
          fi

          export RUSTUP_HOME="$rust_root/.rustup"
          export CARGO_HOME="$rust_root/.cargo"
          export PATH="$CARGO_HOME/bin:$PATH"
          export RUSTUP_TOOLCHAIN=nightly
          target=x86_64-pc-windows-gnullvm
          target_libdir="$(rustc --target "$target" --print target-libdir)"
          if ! compgen -G "$target_libdir/libcore-*.rlib" >/dev/null; then
            echo "Restored rustup metadata references $target, but libcore is missing; repairing it."
            rustup target remove "$target" || true
            rustup target add "$target"
            target_libdir="$(rustc --target "$target" --print target-libdir)"
          fi
          compgen -G "$target_libdir/libcore-*.rlib" >/dev/null
          rustup target list --installed | grep -Fx "$target"

      - name: Build LGPL libmpv directly on the runner
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "ResubWinny Build"
          git config --global user.email "build@resubwinny.invalid"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/build/libmpv/toolchain"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/build/libmpv/recipe"
          sed -i "/ccache_conf.in/d" build/libmpv/toolchain/CMakeLists.txt
          sed -i "/ccache/d" build/libmpv/toolchain/exec.in
          chmod +x build/libmpv/recipe/build.sh
          cd build/libmpv/toolchain
          bash ../recipe/build.sh -t 64 -c clang -s true

      - name: Summarize failed build diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          df -h
          du -sh build/libmpv/toolchain/build* build/libmpv/toolchain/src_packages 2>/dev/null || true
          find build/libmpv/toolchain/build* -type f \
            \( -name '*.log' -o -name CMakeCache.txt \) -print 2>/dev/null || true

      - name: Upload failed build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/libmpv/toolchain/build*/**/*.log
            build/libmpv/toolchain/build*/**/CMakeCache.txt

      - name: Save reusable libmpv sources and Rust toolchain
        if: ${{ always() && steps.libmpv-source-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            build/libmpv/toolchain/src_packages
            build/libmpv/toolchain/install_rustup
          key: ${{ runner.os }}-libmpv-sources-v2-${{ steps.pins.outputs.toolchain_commit }}-${{ steps.pins.outputs.build_recipe_commit }}-${{ steps.pins.outputs.mpv_commit }}-${{ steps.pins.outputs.ffmpeg_commit }}

      - name: Save exact reusable libmpv build state
        if: ${{ always() && steps.libmpv-build-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            build/libmpv/toolchain/build64
            build/libmpv/toolchain/clang_root
          key: ${{ runner.os }}-libmpv-build-${{ env.LIBMPV_BUILD_CACHE_VERSION }}-${{ steps.pins.outputs.toolchain_commit }}-${{ steps.pins.outputs.build_recipe_commit }}-${{ steps.pins.outputs.mpv_commit }}-${{ steps.pins.outputs.ffmpeg_commit }}

      - name: Locate and extract binary artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find build/libmpv/toolchain/release -maxdepth 1 -name 'mpv-dev-lgpl-x86_64-*.7z' -print -quit)"
          test -n "$artifact"
          mkdir -p build/libmpv/binary
          7z x "$artifact" -obuild/libmpv/binary
          test -f build/libmpv/binary/libmpv-2.dll
          test -f build/libmpv/binary/libmpv.dll.a
          cp "$artifact" build/libmpv/

      - name: Verify pinned media source commits
        shell: bash
        env:
          MPV_COMMIT: ${{ steps.pins.outputs.mpv_commit }}
          FFMPEG_COMMIT: ${{ steps.pins.outputs.ffmpeg_commit }}
        run: |
          set -euo pipefail
          test "$(git -C build/libmpv/toolchain/src_packages/mpv rev-parse HEAD)" = "$MPV_COMMIT"
          test "$(git -C build/libmpv/toolchain/src_packages/ffmpeg rev-parse HEAD)" = "$FFMPEG_COMMIT"

      - name: Record the native build environment
        shell: bash
        env:
          BUILD_TAG: ${{ steps.pins.outputs.build_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path

          def output(*command):
              return subprocess.check_output(command, text=True).strip()

          packages = output("dpkg-query", "-W", "-f=${Package}=${Version}\\n").splitlines()
          record = {
              "schemaVersion": 1,
              "buildTag": os.environ["BUILD_TAG"],
              "githubRunner": {
                  "imageOS": os.environ.get("ImageOS"),
                  "imageVersion": os.environ.get("ImageVersion"),
                  "runnerOS": os.environ.get("RUNNER_OS"),
                  "runnerArch": os.environ.get("RUNNER_ARCH"),
              },
              "platform": platform.platform(),
              "tools": {
                  "clang": output("clang", "--version").splitlines()[0],
                  "cmake": output("cmake", "--version").splitlines()[0],
                  "meson": output("meson", "--version"),
                  "ninja": output("ninja", "--version"),
                  "python": platform.python_version(),
              },
              "debianPackages": packages,
          }
          path = Path("build/libmpv/BUILD-ENVIRONMENT.json")
          path.write_text(json.dumps(record, ensure_ascii=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Package complete corresponding source
        shell: pwsh
        run: |
          ./scripts/package-libmpv-source.ps1 `
            -SourceCache build/libmpv/toolchain/src_packages `
            -PatchedToolchain build/libmpv/toolchain `
            -BuildRecipe build/libmpv/recipe `
            -BinaryDirectory build/libmpv/binary `
            -BuildEnvironment build/libmpv/BUILD-ENVIRONMENT.json `
            -OutputDirectory build/libmpv/corresponding-source

      - name: Upload binary and source as one release candidate
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-lgpl-windows-x86_64-release-candidate
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libmpv/mpv-dev-lgpl-x86_64-*.7z
            build/libmpv/binary/libmpv-2.dll
            build/libmpv/binary/libmpv.dll.a
            build/libmpv/corresponding-source/libmpv-corresponding-source-*.tar.gz
            build/libmpv/corresponding-source/SOURCE-RECEIPT.json
            build/libmpv/corresponding-source/PATCHED-TOOLCHAIN.diff
            build/libmpv/corresponding-source/BUILD-ENVIRONMENT.json
