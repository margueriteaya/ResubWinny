name: Build pinned LGPL libmpv

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x86_64:
    name: Windows x86_64 libmpv and corresponding source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout ResubWinny
        uses: actions/checkout@v4

      - name: Check out pinned build sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/libmpv
          git clone https://github.com/zhongfly/mpv-winbuild.git build/libmpv/recipe
          git -C build/libmpv/recipe checkout --detach b4b1088c30e8821e012fd20052de4c2d3a8eaad4
          git clone https://github.com/shinchiro/mpv-winbuild-cmake.git build/libmpv/toolchain
          git -C build/libmpv/toolchain checkout --detach 04283f7e911149809c46bc236a834cf7134ba133
          git -C build/libmpv/toolchain config user.name "ResubWinny Build"
          git -C build/libmpv/toolchain config user.email "build@resubwinny.invalid"

      - name: Apply reviewed LGPL recipe
        shell: bash
        run: |
          set -euo pipefail
          for patch in build/libmpv/recipe/patch/*.patch; do
            git -C build/libmpv/toolchain am --3way "$GITHUB_WORKSPACE/$patch"
          done
          git -C build/libmpv/toolchain am --3way "$GITHUB_WORKSPACE/build/libmpv/recipe/compile-lgpl-libmpv.patch"

      - name: Pin mpv and FFmpeg source commits
        shell: python
        run: |
          from pathlib import Path

          pins = {
              "mpv.cmake": "0fb136f685c21ec10943f682bec1c90220d2d90f",
              "ffmpeg.cmake": "2f209337fc66b58bf0495265880bb37580c3f981",
          }
          root = Path("build/libmpv/toolchain/packages")
          for filename, commit in pins.items():
              path = root / filename
              text = path.read_text(encoding="utf-8")
              marker = "    GIT_REPOSITORY"
              line_end = text.index("\n", text.index(marker)) + 1
              text = text[:line_end] + f"    GIT_TAG {commit}\n" + text[line_end:]
              path.write_text(text, encoding="utf-8", newline="\n")

      - name: Build LGPL libmpv in pinned Arch container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/build/libmpv/toolchain \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed git ninja cmake meson clang lld libc++ unzip ragel yasm nasm gperf rst2pdf python-cairo curl wget mimalloc ccache python-pip 7zip shaderc
              python -m pip install --break-system-packages roman
              git config --global --add safe.directory /work/build/libmpv/toolchain
              git config --global --add safe.directory /work/build/libmpv/recipe
              sed -i "/ccache_conf.in/d" CMakeLists.txt
              sed -i "/ccache/d" exec.in
              chmod +x ../recipe/build.sh
              bash ../recipe/build.sh -t 64 -c clang -s true
              chown -R "$(stat -c "%u:%g" /work)" /work/build/libmpv
            '

      - name: Locate and extract binary artifact
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          artifact="$(find build/libmpv/toolchain/release -maxdepth 1 -name 'mpv-dev-lgpl-x86_64-*.7z' -print -quit)"
          test -n "$artifact"
          mkdir -p build/libmpv/binary
          7z x "$artifact" -obuild/libmpv/binary
          test -f build/libmpv/binary/libmpv-2.dll
          test -f build/libmpv/binary/libmpv.dll.a
          cp "$artifact" build/libmpv/

      - name: Verify pinned media source commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build/libmpv/toolchain/src_packages/mpv rev-parse HEAD)" = "0fb136f685c21ec10943f682bec1c90220d2d90f"
          test "$(git -C build/libmpv/toolchain/src_packages/ffmpeg rev-parse HEAD)" = "2f209337fc66b58bf0495265880bb37580c3f981"

      - name: Package complete corresponding source
        shell: pwsh
        run: |
          ./scripts/package-libmpv-source.ps1 `
            -SourceCache build/libmpv/toolchain/src_packages `
            -PatchedToolchain build/libmpv/toolchain `
            -BuildRecipe build/libmpv/recipe `
            -BinaryDirectory build/libmpv/binary `
            -OutputDirectory build/libmpv/corresponding-source

      - name: Upload binary and source as one release candidate
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl-windows-x86_64-release-candidate
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libmpv/mpv-dev-lgpl-x86_64-*.7z
            build/libmpv/corresponding-source/libmpv-corresponding-source-*.tar.gz
            build/libmpv/corresponding-source/SOURCE-RECEIPT.json
            build/libmpv/corresponding-source/PATCHED-TOOLCHAIN.diff
