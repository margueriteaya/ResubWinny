name: Publish release assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag
        required: true
        type: string
      artifact_run_id:
        description: Successful workflow run containing the release candidate
        required: true
        type: string
      artifact_name:
        description: Release candidate artifact name
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Verify and publish release assets
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Verify candidate manifest
        shell: pwsh
        run: |
          $manifestPath = 'candidate/RELEASE-MANIFEST.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw 'The release candidate does not contain RELEASE-MANIFEST.json.'
          }
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ($manifest.tag -cne '${{ inputs.release_tag }}') {
            throw "Candidate tag mismatch: $($manifest.tag)"
          }
          foreach ($artifact in $manifest.artifacts) {
            $path = Join-Path 'candidate' ($artifact.path -replace '/', [IO.Path]::DirectorySeparatorChar)
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Candidate file is missing: $($artifact.path)"
            }
            $file = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($file.Length -ne $artifact.bytes -or $hash -cne $artifact.sha256) {
              throw "Candidate manifest mismatch: $($artifact.path)"
            }
          }
          $assets = @(
            Get-ChildItem -LiteralPath candidate/application/installers -File |
              Where-Object { $_.Extension -ceq '.msi' -or $_.Name -clike '*-setup.exe' }
          )
          $duplicates = @($assets | Group-Object Name | Where-Object Count -gt 1)
          if ($duplicates) {
            throw "Release assets must have unique filenames: $($duplicates.Name -join ', ')"
          }
          if ($assets.Count -ne 2) {
            throw "Expected exactly one setup executable and one MSI: $($assets.Count)"
          }
          if (@($assets | Where-Object Name -cmatch '_[a-z]{2}-[A-Z]{2}(?:-setup)?\.(?:exe|msi)$').Count -ne 0) {
            throw "Installer filenames must not contain a locale suffix: $($assets.Name -join ', ')"
          }
      - name: Upload assets and publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath candidate/application/installers -File |
              Where-Object { $_.Extension -ceq '.msi' -or $_.Name -clike '*-setup.exe' } |
              Sort-Object Name
          )
          $release = gh release view '${{ inputs.release_tag }}' `
            --repo $env:GITHUB_REPOSITORY `
            --json assets | ConvertFrom-Json
          $wantedNames = @($assets.Name)
          foreach ($publishedAsset in @($release.assets)) {
            if ($publishedAsset.name -notin $wantedNames) {
              gh release delete-asset '${{ inputs.release_tag }}' $publishedAsset.name `
                --repo $env:GITHUB_REPOSITORY `
                --yes
              if ($LASTEXITCODE -ne 0) {
                throw "Removing unexpected release asset failed: $($publishedAsset.name)"
              }
            }
          }
          $arguments = @('release', 'upload', '${{ inputs.release_tag }}')
          $arguments += @($assets | ForEach-Object FullName)
          $arguments += @('--repo', $env:GITHUB_REPOSITORY, '--clobber')
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Release asset upload failed with exit code $LASTEXITCODE."
          }
          $release = gh release view '${{ inputs.release_tag }}' `
            --repo $env:GITHUB_REPOSITORY `
            --json assets | ConvertFrom-Json
          if (@($release.assets).Count -ne 2) {
            throw "Published asset count mismatch: $(@($release.assets).Count) / $($assets.Count)"
          }
          gh release edit '${{ inputs.release_tag }}' `
            --repo $env:GITHUB_REPOSITORY `
            --draft=false `
            --prerelease
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the prerelease failed with exit code $LASTEXITCODE."
          }
