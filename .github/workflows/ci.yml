name: ResubWinny CI

on:
  push:
  pull_request:

concurrency:
  group: resubwinny-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository hygiene
        shell: pwsh
        run: ./scripts/verify-repository.ps1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-tauri/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix studio-tauri
      - name: Format Rust sources
        shell: pwsh
        run: |
          cargo fmt --check
          cargo fmt --manifest-path studio-tauri/src-tauri/Cargo.toml --check
      - name: Lint Worker
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint desktop service
        run: cargo clippy --manifest-path studio-tauri/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build and check desktop frontend
        run: npm run build --prefix studio-tauri
      - name: Verify pinned sources and generated licenses
        shell: pwsh
        run: |
          ./scripts/check-upstreams.ps1
          ./scripts/generate-license-report.ps1 -Check

  platform-tests:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test Worker
        run: cargo test --workspace
      - name: Test desktop service
        run: cargo test --manifest-path studio-tauri/src-tauri/Cargo.toml

  fuzz-build:
    name: Fuzz targets (Linux nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Build every declared fuzz target
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(
            cargo metadata --manifest-path fuzz/Cargo.toml --no-deps --format-version 1 |
              python3 -c 'import json,sys; data=json.load(sys.stdin); print("\n".join(t["name"] for t in data["packages"][0]["targets"] if "bin" in t["kind"]))'
          )
          test "${#targets[@]}" -gt 0
          for target in "${targets[@]}"; do
            echo "Building fuzz target: $target"
            cargo fuzz build "$target"
          done

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit Rust dependencies
        shell: pwsh
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file studio-tauri/src-tauri/Cargo.lock
          cargo audit --file fuzz/Cargo.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-tauri/package-lock.json
      - name: Audit frontend dependencies
        run: npm audit --prefix studio-tauri --audit-level=high

  dependency-policy:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@cargo-deny
      - name: Check Worker dependency policy
        run: cargo deny check --manifest-path Cargo.toml
      - name: Check desktop dependency policy
        run: cargo deny check --manifest-path studio-tauri/src-tauri/Cargo.toml
      - name: Check fuzz dependency policy
        run: cargo deny check --manifest-path fuzz/Cargo.toml
