name: ResubWinny CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: resubwinny-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify repository hygiene
        shell: pwsh
        run: ./scripts/verify-repository.ps1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf llvm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-tauri/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix studio-tauri
      - name: Format Rust sources
        shell: pwsh
        run: |
          cargo fmt --check
          cargo fmt --manifest-path studio-tauri/src-tauri/Cargo.toml --check
      - name: Lint Worker
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint native TLV Worker backend
        run: cargo clippy --workspace --all-targets --features libaribtlv -- -D warnings
      - name: Lint desktop service
        run: cargo clippy --manifest-path studio-tauri/src-tauri/Cargo.toml --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Build and check desktop frontend
        run: npm run build --prefix studio-tauri
      - name: Verify pinned sources and generated licenses
        shell: pwsh
        run: |
          ./scripts/check-upstreams.ps1
          ./scripts/generate-license-report.ps1 -Check

  platform-tests:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Windows libmpv runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-libmpv.ps1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test Worker
        run: cargo test --workspace
      - name: Test native TLV Worker backend
        run: cargo test --workspace --features libaribtlv
      - name: Test desktop service
        run: cargo test --manifest-path studio-tauri/src-tauri/Cargo.toml

  fuzz-build:
    name: Fuzz targets (Linux nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - name: Install native fuzz build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-fuzz
      - name: Select nightly toolchain for cargo-fuzz
        shell: bash
        run: mv rust-toolchain.toml rust-toolchain.toml.ci-backup
      - name: Build every declared fuzz target
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          set -euo pipefail
          mapfile -t targets < <(
            cargo metadata --manifest-path fuzz/Cargo.toml --no-deps --format-version 1 |
              python3 -c 'import json,sys; data=json.load(sys.stdin); print("\n".join(t["name"] for t in data["packages"][0]["targets"] if "bin" in t["kind"]))'
          )
          test "${#targets[@]}" -gt 0
          for target in "${targets[@]}"; do
            echo "Building fuzz target: $target"
            cargo fuzz build --target x86_64-unknown-linux-gnu "$target"
          done

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@1ceecae37ba251f3f09906445d948ebfd5c4e06c # cargo-audit
      - name: Audit Rust dependencies
        shell: pwsh
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file studio-tauri/src-tauri/Cargo.lock
          cargo audit --file fuzz/Cargo.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-tauri/package-lock.json
      - name: Audit frontend dependencies
        run: npm audit --prefix studio-tauri --audit-level=high

  dependency-policy:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny
      - name: Check Worker dependency policy
        run: cargo deny --config deny.toml --manifest-path Cargo.toml check
      - name: Check desktop dependency policy
        run: cargo deny --config deny.toml --manifest-path studio-tauri/src-tauri/Cargo.toml check
