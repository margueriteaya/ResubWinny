name: Windows Alpha candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated ResubWinny release tag to package
        required: true
        type: string
      libmpv_run_id:
        description: Successful libmpv LGPL workflow run containing binary and corresponding source
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Test and package Windows x86_64 Alpha
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      LIBMPV_RUN_ID: ${{ inputs.libmpv_run_id }}
    steps:
      - name: Verify release and libmpv provenance
        id: provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-GitHubApi([string] $Path) {
            $response = gh api $Path
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub API request failed: $Path"
            }
            return $response | ConvertFrom-Json
          }

          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          [long] $runId = 0
          if (-not [long]::TryParse($env:LIBMPV_RUN_ID, [ref] $runId) -or $runId -le 0) {
            throw "Invalid libmpv workflow run ID: $env:LIBMPV_RUN_ID"
          }

          $tagRef = Invoke-GitHubApi "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG"
          if ($tagRef.object.type -cne 'tag') {
            throw 'Release tags must be annotated tags.'
          }
          $tagObject = Invoke-GitHubApi "repos/$env:GITHUB_REPOSITORY/git/tags/$($tagRef.object.sha)"
          if ($tagObject.object.type -cne 'commit') {
            throw 'The annotated release tag must point directly to a commit.'
          }
          $releaseCommit = $tagObject.object.sha

          $run = Invoke-GitHubApi "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId"
          if ($run.path -cne '.github/workflows/libmpv-lgpl.yml' -or
              $run.event -cne 'workflow_dispatch' -or
              $run.status -cne 'completed' -or
              $run.conclusion -cne 'success' -or
              $run.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or
              $run.head_sha -cne $releaseCommit) {
            throw 'The libmpv artifact must come from a successful trusted workflow run for the release commit.'
          }

          "commit=$releaseCommit" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.provenance.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: windows-alpha-candidate-target-v1
          workspaces: ". -> build/cargo"
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-tauri/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix studio-tauri
      - name: Download reviewed libmpv binary and corresponding source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: libmpv-lgpl-windows-x86_64-release-candidate
          path: build/libmpv-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.libmpv_run_id }}
      - name: Install the reviewed libmpv candidate
        shell: pwsh
        run: |
          $dll = Get-ChildItem build/libmpv-candidate -Recurse -File -Filter libmpv-2.dll
          $import = Get-ChildItem build/libmpv-candidate -Recurse -File -Filter libmpv.dll.a
          if (@($dll).Count -ne 1 -or @($import).Count -ne 1) {
            throw 'The libmpv compliance artifact must contain exactly one DLL and import library.'
          }
          $destination = 'third_party/libmpv/windows-x86_64'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination "$destination/libmpv-2.dll" -Force
          Copy-Item -LiteralPath $import.FullName -Destination "$destination/libmpv.dll.a" -Force
      - name: Run package quality gate
        shell: pwsh
        run: ./scripts/check.ps1 -SkipFrontend -SkipFuzz -RequireLibmpvRuntime
      - name: Package public source candidate
        shell: pwsh
        run: ./scripts/package-source.ps1 -Revision $env:RELEASE_TAG
      - name: Build installers
        shell: pwsh
        run: |
          $env:RESUBWINNY_RELEASE_TIER = 'UnsignedWindowsAlpha'
          $env:RESUBWINNY_BUILD_TAG = $env:RELEASE_TAG
          $env:RESUBWINNY_BUILD_COMMIT = '${{ steps.provenance.outputs.commit }}'
          ./scripts/build.ps1 -SkipNpmInstall
      - name: Assemble auditable unsigned Alpha candidate
        shell: pwsh
        run: |
          ./scripts/package-windows-alpha.ps1 `
            -DesktopExecutable build/cargo/release/resubwinny-studio.exe `
            -WorkerExecutable build/cargo/release/arib-caption-worker.exe `
            -InstallerDirectory build/cargo/release/bundle `
            -SourceDirectory build/source `
            -LibmpvCandidateDirectory build/libmpv-candidate `
            -Tag $env:RELEASE_TAG `
            -Revision $env:RELEASE_TAG
      - name: Upload unsigned Windows Alpha candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resubwinny-unsigned-windows-alpha-${{ inputs.release_tag }}
          if-no-files-found: error
          retention-days: 30
          path: build/release/windows-alpha

# This workflow intentionally does not create a GitHub Release. Public binary
# publication remains a reviewed step after packaged Windows acceptance. The
# uploaded candidate already contains the exact LGPL DLL, corresponding source,
# receipt, notices, release provenance, and hashes. Signing is required only
# when promoting a build to Signed Stable.
