[package]
name = "resubwinny-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MPL-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arib-caption-worker = { path = "../crates/arib-caption-worker", features = ["fuzzing"] }

