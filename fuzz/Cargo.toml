test = false
doc = false
bench = false

[[bin]]
name = "parse_ts_transport"
path = "fuzz_targets/parse_ts_transport.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_arib_si_text"
path = "fuzz_targets/decode_arib_si_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_pes_b24"
